<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Logic DAG Builder</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- LZ-String for URL Compression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <!-- vis-network for Graph Rendering -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Inter for UI, JetBrains Mono for Logic nodes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .vis-network:focus { outline: none; }
        /* Custom scrollbar for sidebar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden text-gray-800">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        function App() {
            const loadInitialState = () => {
                // 1. Check if there is a shared graph in the URL
                const urlParams = new URLSearchParams(window.location.search);
                const sharedData = urlParams.get('g');
                if (sharedData) {
                    try {
                        const decoded = JSON.parse(LZString.decompressFromEncodedURIComponent(sharedData));
                        // Clean up the URL so it looks nice after loading
                        window.history.replaceState(null, '', window.location.pathname);
                        return { fields: decoded.fields || [], relationships: decoded.relationships || [] };
                    } catch(e) { 
                        console.error("Failed to parse shared link data."); 
                    }
                }
                // 2. If no URL data, fallback to LocalStorage
                const saved = localStorage.getItem('dag_builder_data');
                return saved ? JSON.parse(saved) : { fields: [], relationships: [] };
            };

            const initialState = loadInitialState();
            
            // --- STATE ---
            const [fields, setFields] = useState(initialState.fields); 
            const [relationships, setRelationships] = useState(initialState.relationships);
            
            // Auto-save to LocalStorage whenever fields or relationships change
            useEffect(() => {
                localStorage.setItem('dag_builder_data', JSON.stringify({ fields, relationships }));
            }, [fields, relationships]);
            
            // UI State
            const [newFieldName, setNewFieldName] = useState('');
            const [comboInputs, setComboInputs] = useState(['', '']); 
            const [comboOutput, setComboOutput] = useState('');
            
            // Direct Link State
            const [directSource, setDirectSource] = useState('');
            const [directTarget, setDirectTarget] = useState('');

            const [error, setError] = useState(null);

            // AI State
            const [isGenerating, setIsGenerating] = useState(false);
            const [isExplaining, setIsExplaining] = useState(false);
            const [explanation, setExplanation] = useState('');
            const [prompt, setPrompt] = useState('');
            
            // Clear Confirmation State
            const [confirmClear, setConfirmClear] = useState(false);
            
            // Share State
            const [shareCopied, setShareCopied] = useState(false);

            const networkRef = useRef(null);
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);

            // --- Graph Rendering Logic ---
            useEffect(() => {
                if (!containerRef.current) return;

                const nodesDataset = new vis.DataSet(
                    fields.map(f => {
                        let nodeProps = { id: f.id, label: f.label };

                        if (f.type === 'operation') {
                            nodeProps.shape = 'circle';
                            nodeProps.margin = 8;
                            nodeProps.color = {
                                background: '#f1f5f9', border: '#cbd5e1',     
                                highlight: { background: '#e2e8f0', border: '#94a3b8' }
                            };
                            nodeProps.font = { size: 16, color: '#475569', face: '"JetBrains Mono", monospace', bold: true };
                            nodeProps.borderWidth = 1;
                            nodeProps.shadow = { enabled: true, color: 'rgba(0,0,0,0.05)', size: 8, x: 0, y: 3 };
                        } else {
                            nodeProps.shape = 'box';
                            nodeProps.margin = { top: 12, bottom: 12, left: 16, right: 16 };
                            nodeProps.color = {
                                background: '#ffffff', border: '#e2e8f0',     
                                highlight: { background: '#f8fafc', border: '#94a3b8' },
                                hover: { background: '#f8fafc', border: '#cbd5e1' }
                            };
                            nodeProps.font = { size: 14, color: '#1e293b', face: '"Inter", sans-serif' };
                            nodeProps.borderWidth = 1;
                            nodeProps.shadow = { enabled: true, color: 'rgba(0,0,0,0.04)', size: 12, x: 0, y: 4 };
                        }
                        return nodeProps;
                    })
                );

                const edgesDataset = new vis.DataSet(
                    relationships.map((r, i) => ({
                        id: `edge_${r.source}_${r.target}_${i}`,
                        from: r.source,
                        to: r.target,
                        arrows: { to: { enabled: true, scaleFactor: 0.8, type: 'arrow' } }
                    }))
                );

                const data = { nodes: nodesDataset, edges: edgesDataset };

                const options = {
                    layout: {
                        hierarchical: {
                            direction: 'UD', sortMethod: 'directed', nodeSpacing: 180, levelSeparation: 120
                        }
                    },
                    edges: {
                        smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 },
                        color: { color: 'rgba(148, 163, 184, 0.5)', highlight: 'rgba(99, 102, 241, 0.8)', hover: 'rgba(148, 163, 184, 0.7)' },
                        width: 2, hoverWidth: 1, selectionWidth: 1,
                        shadow: { enabled: true, color: 'rgba(0,0,0,0.08)', size: 4, x: 0, y: 2 }
                    },
                    physics: false,
                    interaction: { hover: true, tooltipDelay: 200, zoomView: true }
                };

                if (!networkRef.current) {
                    networkRef.current = new vis.Network(containerRef.current, data, options);
                } else {
                    networkRef.current.setData(data);
                }

                if (fields.length <= 5 && fields.length > 0) {
                    networkRef.current.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
                }

            }, [fields, relationships]);

            // --- Cycle Detection ---
            const detectCycle = (edges, newSource, newTarget) => {
                const adjList = {};
                edges.forEach(e => {
                    if (!adjList[e.source]) adjList[e.source] = [];
                    adjList[e.source].push(e.target);
                });
                
                if (!adjList[newSource]) adjList[newSource] = [];
                adjList[newSource].push(newTarget);

                const visited = new Set();
                const recStack = new Set();

                const dfs = (node) => {
                    if (recStack.has(node)) return true;
                    if (visited.has(node)) return false;

                    visited.add(node);
                    recStack.add(node);

                    const neighbors = adjList[node] || [];
                    for (let neighbor of neighbors) {
                        if (dfs(neighbor)) return true;
                    }

                    recStack.delete(node);
                    return false;
                };

                for (let node of Object.keys(adjList)) {
                    if (dfs(node)) return true;
                }
                return false;
            };

            // --- Interaction Logic ---
            const addBaseField = (e) => {
                e.preventDefault();
                setError(null);
                const name = newFieldName.trim();
                
                if (!name) return;
                if (fields.some(f => f.label.toLowerCase() === name.toLowerCase())) {
                    setError(`Field "${name}" already exists.`);
                    return;
                }

                const newId = `field_${Date.now()}`;
                setFields([...fields, { id: newId, label: name, type: 'base' }]);
                setNewFieldName('');
            };

            const removeField = (id) => {
                const remainingFields = fields.filter(f => f.id !== id);
                const remainingRels = relationships.filter(r => r.source !== id && r.target !== id);
                setFields(remainingFields);
                setRelationships(remainingRels);
                setError(null);
            };

            // --- Direct Link Logic ---
            const addDirectLink = (e) => {
                e.preventDefault();
                setError(null);
                
                if (!directSource || !directTarget.trim()) return;
                const targetName = directTarget.trim();

                let newFields = [...fields];
                let newRels = [...relationships];

                // Check if target node already exists
                let targetNode = newFields.find(f => f.label.toLowerCase() === targetName.toLowerCase());
                let targetNodeId = targetNode ? targetNode.id : `field_${Date.now()}`;

                if (!targetNode) {
                    newFields.push({ id: targetNodeId, label: targetName, type: 'derived' });
                }

                // Check for existing identical relationship
                if (newRels.some(r => r.source === directSource && r.target === targetNodeId)) {
                    setError("This direct link already exists.");
                    return;
                }

                // Check for cycles
                if (detectCycle(newRels, directSource, targetNodeId)) {
                    setError("This direct link creates an infinite loop (cycle) and cannot be added.");
                    return;
                }

                newRels.push({ source: directSource, target: targetNodeId });
                setFields(newFields);
                setRelationships(newRels);
                
                // Reset inputs
                setDirectTarget('');
                setDirectSource('');
            };

            const removeEdge = (source, target) => {
                setRelationships(relationships.filter(r => !(r.source === source && r.target === target)));
            };

            // --- Combination Logic ---
            const handleComboInputChange = (index, value) => {
                const newInputs = [...comboInputs];
                newInputs[index] = value;
                setComboInputs(newInputs);
            };

            const addComboInput = () => setComboInputs([...comboInputs, '']);
            const removeComboInput = (index) => {
                if (comboInputs.length <= 2) return;
                setComboInputs(comboInputs.filter((_, i) => i !== index));
            };

            const buildCombination = (e) => {
                e.preventDefault();
                setError(null);

                const selectedInputIds = Array.from(new Set(comboInputs.filter(id => id.trim() !== '')));
                const outName = comboOutput.trim();

                if (selectedInputIds.length < 2) {
                    setError("Select at least 2 distinct inputs to combine.");
                    return;
                }
                if (!outName) {
                    setError("Output name is required.");
                    return;
                }

                let newFields = [...fields];
                let newRels = [...relationships];

                let outNode = newFields.find(f => f.label.toLowerCase() === outName.toLowerCase());
                let outNodeId = outNode ? outNode.id : `field_${Date.now()}`;

                if (!outNode) {
                    newFields.push({ id: outNodeId, label: outName, type: 'derived' });
                }

                const opId = `op_${Date.now()}`;
                newFields.push({ id: opId, label: '+', type: 'operation' });

                let tempRels = [...newRels];
                let hasCycle = false;

                for (let inId of selectedInputIds) {
                    if (detectCycle(tempRels, inId, opId)) { hasCycle = true; break; }
                    tempRels.push({ source: inId, target: opId });
                }
                
                if (!hasCycle) {
                    if (detectCycle(tempRels, opId, outNodeId)) { hasCycle = true; }
                    tempRels.push({ source: opId, target: outNodeId });
                }

                if (hasCycle) {
                    setError("This combination creates an infinite loop (cycle).");
                    return;
                }

                setFields(newFields);
                setRelationships(tempRels);
                setComboInputs(['', '']);
                setComboOutput('');
            };

            const removeCombination = (opId) => {
                const remainingFields = fields.filter(f => f.id !== opId);
                const remainingRels = relationships.filter(r => r.source !== opId && r.target !== opId);
                setFields(remainingFields);
                setRelationships(remainingRels);
            };

            // --- Export / Import Logic ---
            const handleExportJSON = () => {
                const dataStr = JSON.stringify({ fields, relationships }, null, 2);
                const blob = new Blob([dataStr], { type: "text/plain" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `logic_graph_${new Date().toISOString().split('T')[0]}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.fields && data.relationships) {
                            setFields(data.fields);
                            setRelationships(data.relationships);
                            setError(null);
                        } else {
                            setError("Invalid file format. Ensure it's a previously exported graph file.");
                        }
                    } catch (err) {
                        setError("Failed to parse the file. Ensure it is a valid JSON text file.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null; // Reset input so the same file can be loaded again if needed
            };

            const handleExportPNG = () => {
                if (!containerRef.current) return;
                const canvas = containerRef.current.querySelector('canvas');
                if (!canvas) return;

                // Create a temporary canvas to apply a solid background
                // because vis-network canvas is transparent by default
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const ctx = tempCanvas.getContext('2d');
                
                // Draw background
                ctx.fillStyle = '#f8fafc'; // slate-50 to match app bg
                ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                
                // Draw graph on top
                ctx.drawImage(canvas, 0, 0);

                const url = tempCanvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = url;
                a.download = `logic_graph_${new Date().toISOString().split('T')[0]}.png`;
                a.click();
            };

            const handleClearGraph = () => {
                setFields([]);
                setRelationships([]);
                localStorage.removeItem('dag_builder_data');
                setConfirmClear(false);
                setError(null);
            };

            const handleShareLink = () => {
                const dataStr = JSON.stringify({ fields, relationships });
                const compressed = LZString.compressToEncodedURIComponent(dataStr);
                const shareUrl = `${window.location.origin}${window.location.pathname}?g=${compressed}`;
                
                // Copy to clipboard fallback mechanism
                try {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        setShareCopied(true);
                        setTimeout(() => setShareCopied(false), 2000);
                    });
                } catch (err) {
                    // Fallback for iFrames or older browsers
                    const textArea = document.createElement("textarea");
                    textArea.value = shareUrl;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    setShareCopied(true);
                    setTimeout(() => setShareCopied(false), 2000);
                }
            };

            // --- AI Integration ---
            const callGemini = async (systemPrompt, userPrompt, isJson = false) => {
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                if (isJson) payload.generationConfig = { responseMimeType: "application/json" };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error("API Request failed");
                    const result = await response.json();
                    
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("No text returned from API");
                    
                    return isJson ? JSON.parse(text) : text;
                } catch (err) {
                    throw new Error("Failed to process AI request. Please try again.");
                }
            };

            const handleAIGenerate = async (e) => {
                e.preventDefault();
                if (!prompt.trim()) return;
                setIsGenerating(true); setError(null); setExplanation('');

                const sysPrompt = `You are a data architect AI. Breakdown the flow into a Directed Acyclic Graph. 
                Output valid JSON: { "nodes": [ {"id": "unique_str", "label": "str", "type": "base"|"derived"} ], "operations": [ {"id": "unique_str"} ], "edges": [ {"source": "id", "target": "id"} ] }`;

                try {
                    const data = await callGemini(sysPrompt, prompt, true);
                    const newFields = [...data.nodes, ...data.operations.map(op => ({ ...op, label: '+', type: 'operation' }))];
                    setFields(newFields);
                    setRelationships(data.edges);
                    setPrompt('');
                } catch (err) {
                    setError(err.message);
                } finally { setIsGenerating(false); }
            };

            const handleAIExplain = async () => {
                if (fields.length === 0) return;
                setIsExplaining(true); setError(null);

                const sysPrompt = `Explain the following logical DAG structure in plain, concise English. Focus on how inputs flow into final outputs. Max 3 paragraphs.`;
                const graphData = JSON.stringify({ fields, relationships }, null, 2);
                
                try {
                    const exp = await callGemini(sysPrompt, `Explain this logic graph:\n\n${graphData}`, false);
                    setExplanation(exp);
                } catch (err) { setError(err.message); } finally { setIsExplaining(false); }
            };

            // Helpers for UI Rendering
            const availableBaseFields = fields.filter(f => f.type !== 'operation');
            const operations = fields.filter(f => f.type === 'operation');

            // Find direct links (edges where neither source nor target is an operation)
            const directLinks = relationships.filter(r => {
                const sourceField = fields.find(f => f.id === r.source);
                const targetField = fields.find(f => f.id === r.target);
                return sourceField?.type !== 'operation' && targetField?.type !== 'operation';
            });

            // --- UI Rendering ---
            return (
                <div className="flex h-full font-sans bg-gray-50">
                    
                    {/* LEFT PANEL - CONTROLS */}
                    <div className="w-[420px] flex-shrink-0 border-r border-gray-200 bg-white flex flex-col shadow-lg z-10">
                        <div className="p-6 border-b border-gray-100 bg-white flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-semibold text-gray-900 flex items-center gap-2 tracking-tight">
                                    <i className="fas fa-project-diagram text-indigo-600"></i> Logic Builder
                                </h1>
                                <p className="text-sm text-gray-500 mt-1">Define nodes and combine them.</p>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 space-y-8">
                            
                            {/* Error Alert */}
                            {error && (
                                <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm text-sm text-red-700 flex justify-between items-start">
                                    <span><i className="fas fa-exclamation-circle mr-1"></i> {error}</span>
                                    <button onClick={() => setError(null)} className="text-red-400 hover:text-red-600"><i className="fas fa-times"></i></button>
                                </div>
                            )}

                            {/* Section 1: AI Generator */}
                            <div className="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                                <h2 className="text-xs font-bold text-indigo-800 uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <i className="fas fa-sparkles"></i> AI Generate
                                </h2>
                                <form onSubmit={handleAIGenerate}>
                                    <textarea 
                                        value={prompt}
                                        onChange={(e) => setPrompt(e.target.value)}
                                        placeholder="E.g., Take email and password, check auth, and output success or error."
                                        className="w-full text-sm border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3 mb-2"
                                        rows="2"
                                    />
                                    <button 
                                        type="submit" 
                                        disabled={isGenerating || !prompt.trim()}
                                        className="w-full bg-indigo-600 text-white text-sm font-medium py-2 px-4 rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors shadow-sm"
                                    >
                                        {isGenerating ? <><i className="fas fa-spinner fa-spin mr-2"></i> Generating...</> : "Generate Graph"}
                                    </button>
                                </form>
                            </div>

                            {/* Section 2: Add Node */}
                            <div>
                                <h2 className="text-sm font-semibold text-gray-900 mb-3 border-b border-gray-100 pb-2">1. Define Nodes</h2>
                                <form onSubmit={addBaseField} className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={newFieldName}
                                        onChange={(e) => setNewFieldName(e.target.value)}
                                        placeholder="Node name (e.g., 'has')" 
                                        className="flex-1 text-sm border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border"
                                    />
                                    <button 
                                        type="submit" 
                                        className="bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-50 font-medium text-sm transition-colors shadow-sm"
                                    >
                                        Add
                                    </button>
                                </form>
                                
                                {availableBaseFields.length > 0 && (
                                    <div className="mt-3 flex flex-wrap gap-2">
                                        {availableBaseFields.map(f => (
                                            <span key={f.id} className="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200">
                                                {f.label}
                                                <button type="button" onClick={() => removeField(f.id)} className="ml-1.5 text-gray-400 hover:text-red-500 focus:outline-none">
                                                    <i className="fas fa-times"></i>
                                                </button>
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Section 3: Direct Link */}
                            <div>
                                <h2 className="text-sm font-semibold text-gray-900 mb-3 border-b border-gray-100 pb-2">2. Direct Descendant (A ➔ B)</h2>
                                <form onSubmit={addDirectLink} className="bg-white border border-gray-200 p-4 rounded-xl shadow-sm">
                                    <div className="flex gap-2 items-center mb-3">
                                        <select 
                                            value={directSource} 
                                            onChange={(e) => setDirectSource(e.target.value)}
                                            className="w-1/2 text-sm border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2 bg-gray-50"
                                        >
                                            <option value="">-- Source Node --</option>
                                            {availableBaseFields.map(f => (
                                                <option key={f.id} value={f.id}>{f.label}</option>
                                            ))}
                                        </select>
                                        <i className="fas fa-arrow-right text-gray-400 text-xs"></i>
                                        <input
                                            type="text"
                                            value={directTarget}
                                            onChange={(e) => setDirectTarget(e.target.value)}
                                            placeholder="Target Node"
                                            className="w-1/2 text-sm border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2"
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-white border border-gray-300 text-gray-800 text-sm font-medium py-2 px-4 rounded-lg hover:bg-gray-50 transition-colors shadow-sm"
                                    >
                                        Link Directly
                                    </button>
                                </form>
                            </div>

                            {/* Section 4: Logic Combinations */}
                            <div>
                                <h2 className="text-sm font-semibold text-gray-900 mb-3 border-b border-gray-100 pb-2">3. Combine Logic (+)</h2>
                                <form onSubmit={buildCombination} className="bg-white border border-gray-200 p-4 rounded-xl shadow-sm">
                                    <div className="mb-4">
                                        <label className="block text-xs font-medium text-gray-500 mb-2 uppercase tracking-wide">Inputs</label>
                                        <div className="space-y-2">
                                            {comboInputs.map((inputVal, idx) => (
                                                <div key={idx} className="flex gap-2 items-center">
                                                    <select 
                                                        value={inputVal} 
                                                        onChange={(e) => handleComboInputChange(idx, e.target.value)}
                                                        className="block w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2 bg-gray-50"
                                                    >
                                                        <option value="">-- Select Input --</option>
                                                        {availableBaseFields.map(f => (
                                                            <option key={f.id} value={f.id}>{f.label}</option>
                                                        ))}
                                                    </select>
                                                    {comboInputs.length > 2 && (
                                                        <button type="button" onClick={() => removeComboInput(idx)} className="text-gray-400 hover:text-red-500">
                                                            <i className="fas fa-minus-circle"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        <button type="button" onClick={addComboInput} className="text-xs text-indigo-600 hover:text-indigo-800 mt-2 flex items-center gap-1 font-medium">
                                            <i className="fas fa-plus"></i> Add another input
                                        </button>
                                    </div>

                                    <div className="mb-4">
                                        <label className="block text-xs font-medium text-gray-500 mb-2 uppercase tracking-wide">Output Node</label>
                                        <input type="text" value={comboOutput} onChange={(e) => setComboOutput(e.target.value)} placeholder="e.g., 'hasnt'" className="block w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2" />
                                    </div>

                                    <button type="submit" className="w-full bg-gray-900 text-white text-sm font-medium py-2.5 px-4 rounded-lg hover:bg-black transition-colors shadow-sm">
                                        Combine Node Logic
                                    </button>
                                </form>
                            </div>

                            {/* Existing Rules Summary */}
                            {(operations.length > 0 || directLinks.length > 0) && (
                                <div>
                                    <h2 className="text-sm font-semibold text-gray-900 mb-3 border-b border-gray-100 pb-2">Active Rules & Links</h2>
                                    <div className="space-y-2">
                                        
                                        {/* Render Direct Links */}
                                        {directLinks.map((link, idx) => {
                                            const sourceLabel = fields.find(f => f.id === link.source)?.label || '?';
                                            const targetLabel = fields.find(f => f.id === link.target)?.label || '?';
                                            return (
                                                <div key={`dl_${idx}`} className="bg-white p-3 rounded-lg border border-gray-200 flex justify-between items-start group shadow-sm">
                                                    <div className="text-sm text-gray-600 flex flex-wrap items-center gap-2">
                                                        <span>{sourceLabel}</span>
                                                        <i className="fas fa-arrow-right text-gray-400 text-xs"></i>
                                                        <span className="font-semibold text-gray-900 bg-gray-50 border border-gray-200 px-2 py-0.5 rounded shadow-sm">{targetLabel}</span>
                                                    </div>
                                                    <button onClick={() => removeEdge(link.source, link.target)} className="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity ml-2" title="Delete link">
                                                        <i className="fas fa-trash-alt"></i>
                                                    </button>
                                                </div>
                                            );
                                        })}

                                        {/* Render Operations */}
                                        {operations.map(op => {
                                            const incomingEdges = relationships.filter(r => r.target === op.id);
                                            const outgoingEdges = relationships.filter(r => r.source === op.id);
                                            
                                            const incoming = incomingEdges.map(e => fields.find(f => f.id === e.source)?.label || '?');
                                            const outgoing = outgoingEdges.map(e => fields.find(f => f.id === e.target)?.label || '?');

                                            return (
                                                <div key={op.id} className="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-start group shadow-sm">
                                                    <div className="text-sm font-mono text-gray-600 flex flex-wrap items-center gap-2">
                                                        <span>[{incoming.join(', ')}]</span>
                                                        <span className="text-gray-900 font-bold text-lg leading-none">+</span>
                                                        <i className="fas fa-arrow-right text-gray-400 text-xs"></i>
                                                        <span className="font-semibold text-gray-900 bg-white border border-gray-200 px-2 py-0.5 rounded shadow-sm">{outgoing.join(', ')}</span>
                                                    </div>
                                                    <button onClick={() => removeCombination(op.id)} className="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity ml-2" title="Delete combination">
                                                        <i className="fas fa-trash-alt"></i>
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                        </div>

                        {/* DATA MANAGEMENT FOOTER */}
                        <div className="p-4 border-t border-gray-200 bg-gray-50 flex gap-2">
                            <button 
                                onClick={handleExportJSON}
                                className="flex-1 bg-white border border-gray-300 text-gray-700 text-xs font-medium py-2 px-2 rounded-lg hover:bg-gray-100 transition-colors shadow-sm flex items-center justify-center gap-1"
                                title="Export graph data to a text file"
                            >
                                <i className="fas fa-download"></i> Save
                            </button>
                            
                            <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={handleImportJSON} 
                                accept=".txt,.json" 
                                className="hidden" 
                            />
                            
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="flex-1 bg-white border border-gray-300 text-gray-700 text-xs font-medium py-2 px-2 rounded-lg hover:bg-gray-100 transition-colors shadow-sm flex items-center justify-center gap-1"
                                title="Import graph data from a text file"
                            >
                                <i className="fas fa-upload"></i> Load
                            </button>

                            {confirmClear ? (
                                <div className="flex-1 flex gap-1">
                                    <button onClick={handleClearGraph} className="flex-1 bg-red-600 text-white text-xs font-medium py-2 px-1 rounded-lg hover:bg-red-700 transition-colors shadow-sm">Yes</button>
                                    <button onClick={() => setConfirmClear(false)} className="flex-1 bg-gray-200 text-gray-700 text-xs font-medium py-2 px-1 rounded-lg hover:bg-gray-300 transition-colors shadow-sm">No</button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setConfirmClear(true)}
                                    className="flex-1 bg-white border border-gray-300 text-red-600 text-xs font-medium py-2 px-2 rounded-lg hover:bg-red-50 transition-colors shadow-sm flex items-center justify-center gap-1"
                                    title="Clear entire graph"
                                >
                                    <i className="fas fa-trash"></i> Clear
                                </button>
                            )}
                        </div>
                    </div>

                    {/* RIGHT PANEL - GRAPH VISUALIZATION */}
                    <div className="flex-1 flex flex-col bg-slate-50 relative">
                        {/* Top Header/Toolbar inside graph area */}
                        <div className="absolute top-4 right-4 z-10 flex gap-3">
                            <button 
                                onClick={handleShareLink}
                                disabled={fields.length === 0}
                                className={`bg-white border border-gray-200 text-sm font-medium py-2 px-4 rounded-lg shadow-sm disabled:opacity-50 transition-colors flex items-center gap-2 ${shareCopied ? 'text-green-600 border-green-200 bg-green-50' : 'text-indigo-600 hover:bg-indigo-50'}`}
                                title="Generate shareable URL"
                            >
                                {shareCopied ? <><i className="fas fa-check"></i> Copied!</> : <><i className="fas fa-link"></i> Share Link</>}
                            </button>
                            <button 
                                onClick={handleAIExplain}
                                disabled={isExplaining || fields.length === 0}
                                className="bg-white border border-gray-200 text-indigo-600 hover:bg-indigo-50 text-sm font-medium py-2 px-4 rounded-lg shadow-sm disabled:opacity-50 transition-colors flex items-center gap-2"
                            >
                                {isExplaining ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-comment-dots"></i>}
                                Explain Graph
                            </button>
                            <button 
                                onClick={handleExportPNG}
                                disabled={fields.length === 0}
                                className="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 text-sm py-2 px-4 rounded-lg shadow-sm disabled:opacity-50 transition-colors flex items-center gap-2"
                                title="Export graph as Image"
                            >
                                <i className="fas fa-image"></i> Save PNG
                            </button>
                            <button 
                                onClick={() => networkRef.current?.fit({ animation: { duration: 500 } })}
                                className="bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm py-2 px-3 rounded-lg shadow-sm transition-colors"
                                title="Center Graph"
                            >
                                <i className="fas fa-expand-arrows-alt"></i>
                            </button>
                        </div>

                        {/* Explanation Modal/Overlay */}
                        {explanation && (
                            <div className="absolute bottom-4 left-4 right-4 bg-white/95 backdrop-blur border border-indigo-100 rounded-xl p-5 shadow-xl z-20 max-w-3xl mx-auto">
                                <div className="flex justify-between items-start mb-2">
                                    <h3 className="font-semibold text-indigo-900 flex items-center gap-2">
                                        <i className="fas fa-robot text-indigo-500"></i> AI Explanation
                                    </h3>
                                    <button onClick={() => setExplanation('')} className="text-gray-400 hover:text-gray-700">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">
                                    {explanation}
                                </div>
                            </div>
                        )}

                        {/* Graph Canvas Container */}
                        <div ref={containerRef} className="flex-1 w-full h-full cursor-grab active:cursor-grabbing"></div>
                        
                        {/* Empty State Overlay */}
                        {fields.length === 0 && (
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div className="text-center text-gray-400">
                                    <i className="fas fa-project-diagram text-5xl mb-4 opacity-50"></i>
                                    <p className="text-lg">Add nodes and combine them to start building your logic graph.</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
